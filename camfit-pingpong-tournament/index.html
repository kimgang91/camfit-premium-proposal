<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>캠핏 탁구 토너먼트 🏓</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
    body { font-family: 'Noto Sans KR', sans-serif; }

    .hero-gradient {
      background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 40%, #10b981 100%);
    }

    .card-hover { transition: transform 0.2s, box-shadow 0.2s; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }

    /* Bracket styles */
    .bracket-container { overflow-x: auto; padding: 2rem 1rem; }

    .bracket {
      display: flex;
      align-items: center;
      gap: 0;
      min-width: fit-content;
    }

    .round {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 160px;
      position: relative;
    }

    .match-wrapper {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      position: relative;
    }

    .match {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin: 8px 0;
    }

    .match-slot {
      padding: 8px 12px;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 140px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .match-slot:hover:not(.empty):not(.bye) {
      border-color: #0ea5e9;
      background: #f0f9ff;
    }

    .match-slot.winner {
      background: #ecfdf5;
      border-color: #10b981;
      font-weight: 700;
      color: #065f46;
    }

    .match-slot.loser {
      opacity: 0.4;
      text-decoration: line-through;
    }

    .match-slot.empty {
      background: #f1f5f9;
      border-color: #e2e8f0;
      color: #94a3b8;
      cursor: default;
    }

    .match-slot.bye {
      background: #fffbeb;
      border-color: #fbbf24;
      color: #92400e;
      cursor: default;
      font-style: italic;
    }

    /* Connector lines */
    .connector {
      width: 24px;
      min-width: 24px;
      position: relative;
    }

    .connector-line {
      position: absolute;
      border-color: #cbd5e1;
      border-style: solid;
    }

    /* Champion display */
    .champion-box {
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      color: #78350f;
      padding: 16px 24px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 1.1rem;
      text-align: center;
      min-width: 160px;
      box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4);
    }

    .ping-pong-bounce {
      animation: bounce 1s ease infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .confetti { pointer-events: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; }
    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      opacity: 0;
      animation: confetti-fall 3s ease-out forwards;
    }
    @keyframes confetti-fall {
      0% { opacity: 1; transform: translateY(-20px) rotate(0deg); }
      100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Hero Section -->
  <header class="hero-gradient text-white py-12 px-4 text-center relative overflow-hidden">
    <div class="absolute inset-0 opacity-10">
      <div class="absolute top-10 left-10 text-8xl">🏓</div>
      <div class="absolute bottom-10 right-10 text-8xl">🏓</div>
      <div class="absolute top-20 right-1/4 text-6xl">🏆</div>
    </div>
    <div class="relative z-10 max-w-3xl mx-auto">
      <div class="text-5xl mb-4 ping-pong-bounce">🏓</div>
      <h1 class="text-3xl md:text-5xl font-black mb-3 tracking-tight">캠핏 탁구 토너먼트</h1>
      <p class="text-lg md:text-xl font-medium opacity-90 mb-6">굿바이 디캠프, 헬로 삼성동!</p>
      <div class="flex flex-col sm:flex-row gap-4 justify-center items-center text-sm md:text-base">
        <div class="bg-white/20 backdrop-blur-sm rounded-xl px-5 py-3">
          <span class="font-bold">📅 일시</span><br>
          5월 20일(화) 17:00 이후 예정
          <br><span class="text-xs opacity-75">(일정에 따라 변동될 수 있습니다)</span>
        </div>
        <div class="bg-white/20 backdrop-blur-sm rounded-xl px-5 py-3">
          <span class="font-bold">🎁 1등 상품</span><br>
          <span class="text-xl font-black">현장에서 공개!</span>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 space-y-10">

    <!-- Registration Form -->
    <section class="max-w-lg mx-auto">
      <div class="bg-white rounded-2xl shadow-lg p-6 md:p-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
          ✍️ 참여 신청
        </h2>
        <form id="registrationForm" class="space-y-4">
          <div>
            <label for="playerName" class="block text-sm font-semibold text-gray-700 mb-1">성함 <span class="text-red-500">*</span></label>
            <input type="text" id="playerName" required placeholder="이름을 입력해 주세요"
              class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-200 outline-none transition-all text-gray-800">
          </div>
          <div>
            <label for="playerDept" class="block text-sm font-semibold text-gray-700 mb-1">부서 <span class="text-red-500">*</span></label>
            <select id="playerDept" required
              class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-200 outline-none transition-all text-gray-800 bg-white">
              <option value="">부서를 선택해 주세요</option>
              <option value="경영진">경영진</option>
              <option value="CEO Staff">CEO Staff</option>
              <option value="CorporateDevelopment">CorporateDevelopment</option>
              <option value="Product">Product</option>
              <option value="영업">영업</option>
              <option value="운영">운영</option>
              <option value="Business Development">Business Development</option>
              <option value="HMD">HMD</option>
              <option value="피코">피코</option>
              <option value="와일드">와일드</option>
            </select>
          </div>
          <button type="submit"
            class="w-full py-3 bg-gradient-to-r from-cyan-500 to-emerald-500 text-white font-bold rounded-xl hover:from-cyan-600 hover:to-emerald-600 transition-all shadow-md hover:shadow-lg active:scale-95">
            🏓 참여 신청
          </button>
        </form>
      </div>
    </section>

    <!-- Participants List -->
    <section>
      <div class="bg-white rounded-2xl shadow-lg p-6 md:p-8">
        <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
          <h2 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
            👥 참여자 목록 <span id="participantCount" class="text-base font-normal text-gray-400">(0명)</span>
          </h2>
          <button id="clearAllBtn" class="text-sm text-red-400 hover:text-red-600 transition hidden">전체 삭제</button>
        </div>
        <div id="participantList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 mb-6">
          <p id="emptyMsg" class="text-gray-400 col-span-full text-center py-8">아직 신청한 참여자가 없습니다.</p>
        </div>
        <button id="generateBracketBtn" disabled
          class="w-full py-3 bg-gradient-to-r from-amber-500 to-orange-500 text-white font-bold rounded-xl hover:from-amber-600 hover:to-orange-600 transition-all shadow-md hover:shadow-lg active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:from-amber-500 disabled:hover:to-orange-500">
          🎲 대진표 자동 생성하기
        </button>
      </div>
    </section>

    <!-- Tournament Bracket -->
    <section id="bracketSection" class="hidden">
      <div class="bg-white rounded-2xl shadow-lg p-6 md:p-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-2 flex items-center gap-2">🏆 토너먼트 대진표</h2>
        <p class="text-sm text-gray-400 mb-6">선수 이름을 클릭하면 승자로 선택됩니다.</p>
        <div class="bracket-container">
          <div id="bracketDisplay" class="bracket"></div>
        </div>
        <div id="championDisplay" class="hidden mt-8 text-center">
          <div class="inline-block champion-box text-2xl">
            🏆 우승: <span id="championName"></span> 🏆
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="text-center py-6 text-gray-400 text-sm">
    © 2026 Camfit Inc. — 삼성동에서 새 출발 🚀
  </footer>

  <!-- Confetti container -->
  <div id="confettiContainer"></div>

  <script>
    // Google Sheets API
    const API_URL = 'https://script.google.com/macros/s/AKfycbyTvqw2O44iYAznCooVmKYvG9wm5AA2R49SM2N4R5TTzmEs9Z924DO1wtfe_UcQOpebrg/exec';

    // State
    let participants = [];
    let isLoading = false;
    let bracket = null;

    // DOM refs
    const form = document.getElementById('registrationForm');
    const nameInput = document.getElementById('playerName');
    const deptInput = document.getElementById('playerDept');
    const submitBtn = form.querySelector('button[type="submit"]');
    const listEl = document.getElementById('participantList');
    const emptyMsg = document.getElementById('emptyMsg');
    const countEl = document.getElementById('participantCount');
    const genBtn = document.getElementById('generateBracketBtn');
    const clearBtn = document.getElementById('clearAllBtn');
    const bracketSection = document.getElementById('bracketSection');
    const bracketDisplay = document.getElementById('bracketDisplay');
    const championDisplay = document.getElementById('championDisplay');
    const championName = document.getElementById('championName');

    // Load participants from Google Sheets
    async function loadParticipants() {
      try {
        listEl.innerHTML = '<p class="text-gray-400 col-span-full text-center py-8">불러오는 중...</p>';
        const res = await fetch(API_URL);
        const data = await res.json();
        participants = (data.participants || []).map((p, i) => ({ ...p, id: i }));
        renderParticipants();
      } catch (err) {
        listEl.innerHTML = '<p class="text-red-400 col-span-full text-center py-8">데이터를 불러오지 못했습니다. 새로고침 해주세요.</p>';
      }
    }

    // Registration
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (isLoading) return;
      const name = nameInput.value.trim();
      const dept = deptInput.value;
      if (!name || !dept) return;

      if (participants.some(p => p.name === name && p.dept === dept)) {
        alert('이미 등록된 참여자입니다.');
        return;
      }

      isLoading = true;
      submitBtn.disabled = true;
      submitBtn.textContent = '신청 중...';

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'add', name, dept }),
        });
        const data = await res.json();
        participants = (data.participants || []).map((p, i) => ({ ...p, id: i }));
        nameInput.value = '';
        deptInput.value = '';
        nameInput.focus();
        renderParticipants();
      } catch (err) {
        alert('신청 중 오류가 발생했습니다. 다시 시도해 주세요.');
      } finally {
        isLoading = false;
        submitBtn.disabled = false;
        submitBtn.innerHTML = '🏓 참여 신청';
      }
    });

    clearBtn.addEventListener('click', () => {
      alert('참여자 삭제는 구글 시트에서 직접 관리해 주세요.');
    });

    async function removeParticipant(name, dept) {
      if (!confirm(`${name}(${dept}) 님을 삭제하시겠습니까?`)) return;
      const pw = prompt('삭제는 관리자만 가능합니다.\n비밀번호를 입력해 주세요:');
      if (pw !== ADMIN_PW) { if (pw !== null) alert('비밀번호가 일치하지 않습니다.'); return; }

      try {
        listEl.innerHTML = '<p class="text-gray-400 col-span-full text-center py-8">삭제 중...</p>';
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'delete', name, dept }),
        });
        const data = await res.json();
        participants = (data.participants || []).map((p, i) => ({ ...p, id: i }));
        renderParticipants();
      } catch (err) {
        alert('삭제 중 오류가 발생했습니다.');
        loadParticipants();
      }
    }

    function renderParticipants() {
      countEl.textContent = `(${participants.length}명)`;
      genBtn.disabled = participants.length < 2;
      clearBtn.classList.toggle('hidden', participants.length === 0);

      if (participants.length === 0) {
        listEl.innerHTML = '<p class="text-gray-400 col-span-full text-center py-8">아직 신청한 참여자가 없습니다.</p>';
        return;
      }

      listEl.innerHTML = participants.map((p, i) => `
        <div class="card-hover flex items-center justify-between bg-gradient-to-r from-gray-50 to-white border border-gray-100 rounded-xl px-4 py-3 group">
          <div class="flex items-center gap-3">
            <span class="w-7 h-7 flex items-center justify-center rounded-full bg-cyan-100 text-cyan-700 text-xs font-bold">${i + 1}</span>
            <div>
              <p class="font-semibold text-gray-800 text-sm">${escapeHtml(p.name)}</p>
              <p class="text-xs text-gray-400">${escapeHtml(p.dept)}</p>
            </div>
          </div>
          <button onclick="removeParticipant('${escapeHtml(p.name)}','${escapeHtml(p.dept)}')" class="text-gray-300 hover:text-red-500 transition opacity-0 group-hover:opacity-100 text-lg leading-none" title="삭제">&times;</button>
        </div>
      `).join('');
    }

    // Generate bracket (password protected)
    const ADMIN_PW = 'camfit!';
    genBtn.addEventListener('click', () => {
      if (participants.length < 2) return;
      const pw = prompt('대진표 생성은 관리자만 가능합니다.\n비밀번호를 입력해 주세요:');
      if (pw !== ADMIN_PW) {
        if (pw !== null) alert('비밀번호가 일치하지 않습니다.');
        return;
      }
      generateBracket();
      bracketSection.classList.remove('hidden');
      championDisplay.classList.add('hidden');
      setTimeout(() => bracketSection.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
    });

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function generateBracket() {
      const shuffled = shuffle(participants);
      const n = shuffled.length;

      // Find next power of 2
      let size = 1;
      while (size < n) size *= 2;

      const totalRounds = Math.log2(size);
      const byes = size - n;

      // Fill first round slots
      // Place byes so that top seeds get byes
      const slots = new Array(size).fill(null);
      let playerIdx = 0;
      for (let i = 0; i < size; i++) {
        if (playerIdx < n) {
          slots[i] = { name: shuffled[playerIdx].name, dept: shuffled[playerIdx].dept };
          playerIdx++;
        }
      }

      // Build rounds
      const rounds = [];

      // First round
      const firstRound = [];
      for (let i = 0; i < size; i += 2) {
        const p1 = slots[i];
        const p2 = slots[i + 1];
        const match = { p1, p2, winner: null, matchIdx: firstRound.length };

        // Auto-advance byes
        if (p1 && !p2) {
          match.winner = p1;
          match.isBye = true;
        } else if (!p1 && p2) {
          match.winner = p2;
          match.isBye = true;
        } else if (!p1 && !p2) {
          match.isEmpty = true;
        }

        firstRound.push(match);
      }
      rounds.push(firstRound);

      // Subsequent rounds
      let prevRound = firstRound;
      for (let r = 1; r < totalRounds; r++) {
        const round = [];
        for (let i = 0; i < prevRound.length; i += 2) {
          const match = { p1: null, p2: null, winner: null, matchIdx: round.length, sourceMatches: [i, i + 1] };

          // If both source matches have winners (from byes), fill in
          if (prevRound[i].winner) match.p1 = prevRound[i].winner;
          if (prevRound[i + 1] && prevRound[i + 1].winner) match.p2 = prevRound[i + 1].winner;

          // Auto-advance if one side is from empty match
          if (match.p1 && !match.p2 && prevRound[i + 1] && prevRound[i + 1].isEmpty) {
            match.winner = match.p1;
            match.isBye = true;
          } else if (!match.p1 && match.p2 && prevRound[i].isEmpty) {
            match.winner = match.p2;
            match.isBye = true;
          } else if (match.p1 && match.p2 && !prevRound[i + 1]) {
            match.winner = match.p1;
            match.isBye = true;
          }

          round.push(match);
        }
        rounds.push(round);
        prevRound = round;
      }

      bracket = { rounds, totalRounds };

      // Propagate initial byes through all rounds
      propagateByes();
      renderBracket();
    }

    function propagateByes() {
      for (let r = 1; r < bracket.rounds.length; r++) {
        const round = bracket.rounds[r];
        const prevRound = bracket.rounds[r - 1];
        for (let m = 0; m < round.length; m++) {
          const src1 = m * 2;
          const src2 = m * 2 + 1;
          if (prevRound[src1] && prevRound[src1].winner) round[m].p1 = prevRound[src1].winner;
          if (prevRound[src2] && prevRound[src2].winner) round[m].p2 = prevRound[src2].winner;

          // Auto-advance byes
          if (round[m].p1 && !round[m].p2 && (!prevRound[src2] || prevRound[src2].isEmpty || prevRound[src2].isBye)) {
            if (!prevRound[src2] || prevRound[src2].winner) {
              // Check if both sources are resolved
              const src2Resolved = !prevRound[src2] || prevRound[src2].winner !== null || prevRound[src2].isEmpty;
              if (src2Resolved && !prevRound[src2]?.winner && (prevRound[src2]?.isEmpty || !prevRound[src2])) {
                round[m].winner = round[m].p1;
                round[m].isBye = true;
              }
            }
          }
          if (!round[m].p1 && round[m].p2) {
            const src1Resolved = prevRound[src1].winner !== null || prevRound[src1].isEmpty;
            if (src1Resolved && !prevRound[src1].winner && prevRound[src1].isEmpty) {
              round[m].winner = round[m].p2;
              round[m].isBye = true;
            }
          }
        }
      }
    }

    function selectWinner(roundIdx, matchIdx, slotIdx) {
      const match = bracket.rounds[roundIdx][matchIdx];
      if (match.isBye || match.isEmpty) return;

      const selected = slotIdx === 0 ? match.p1 : match.p2;
      if (!selected) return;

      // If already decided and clicking same winner, deselect
      if (match.winner && match.winner.name === selected.name && match.winner.dept === selected.dept) {
        // Clear this winner and all downstream
        clearDownstream(roundIdx, matchIdx);
        renderBracket();
        championDisplay.classList.add('hidden');
        return;
      }

      match.winner = selected;

      // Clear downstream first
      clearDownstreamOnly(roundIdx, matchIdx);

      // Propagate winner to next round
      if (roundIdx + 1 < bracket.rounds.length) {
        const nextMatchIdx = Math.floor(matchIdx / 2);
        const nextSlot = matchIdx % 2 === 0 ? 'p1' : 'p2';
        bracket.rounds[roundIdx + 1][nextMatchIdx][nextSlot] = selected;
      }

      // Check for champion
      const finalRound = bracket.rounds[bracket.rounds.length - 1];
      if (finalRound[0].winner) {
        championName.textContent = `${finalRound[0].winner.name} (${finalRound[0].winner.dept})`;
        championDisplay.classList.remove('hidden');
        launchConfetti();
      }

      renderBracket();
    }

    function clearDownstream(roundIdx, matchIdx) {
      const match = bracket.rounds[roundIdx][matchIdx];
      match.winner = null;
      clearDownstreamOnly(roundIdx, matchIdx);
    }

    function clearDownstreamOnly(roundIdx, matchIdx) {
      if (roundIdx + 1 >= bracket.rounds.length) return;
      const nextMatchIdx = Math.floor(matchIdx / 2);
      const nextSlot = matchIdx % 2 === 0 ? 'p1' : 'p2';
      const nextMatch = bracket.rounds[roundIdx + 1][nextMatchIdx];
      nextMatch[nextSlot] = null;
      if (nextMatch.winner) {
        nextMatch.winner = null;
        nextMatch.isBye = false;
        clearDownstreamOnly(roundIdx + 1, nextMatchIdx);
      }
    }

    function renderBracket() {
      if (!bracket) return;

      const { rounds, totalRounds } = bracket;
      const roundNames = getRoundNames(totalRounds);

      let html = '';

      rounds.forEach((round, rIdx) => {
        // Round column
        html += `<div class="round" style="flex-shrink:0;">`;
        html += `<div class="text-center text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">${roundNames[rIdx]}</div>`;

        // Calculate spacing
        const gap = Math.pow(2, rIdx);
        const topPad = (gap - 1) * 30;

        html += `<div style="display:flex; flex-direction:column; justify-content:space-around; height:${rounds[0].length * 76}px;">`;

        round.forEach((match, mIdx) => {
          if (match.isEmpty) {
            html += `<div class="match" style="visibility:hidden;"><div class="match-slot empty">-</div><div class="match-slot empty">-</div></div>`;
            return;
          }

          html += `<div class="match">`;

          // Slot 1
          html += renderSlot(match, 0, rIdx, mIdx);
          // Slot 2
          html += renderSlot(match, 1, rIdx, mIdx);

          html += `</div>`;
        });

        html += `</div></div>`;

        // Connector lines between rounds
        if (rIdx < totalRounds - 1) {
          html += `<div class="connector"><svg width="24" height="${rounds[0].length * 76}" style="display:block;">`;
          const nextRound = rounds[rIdx + 1];
          const currCount = round.length;
          const nextCount = nextRound.length;
          const currH = rounds[0].length * 76;
          const currSpacing = currH / currCount;
          const nextSpacing = currH / nextCount;

          for (let i = 0; i < nextCount; i++) {
            const top = i * 2 * currSpacing + currSpacing / 2;
            const bottom = (i * 2 + 1) * currSpacing + currSpacing / 2;
            const mid = i * nextSpacing + nextSpacing / 2;
            // Horizontal from top match
            html += `<line x1="0" y1="${top}" x2="12" y2="${top}" stroke="#cbd5e1" stroke-width="2"/>`;
            // Horizontal from bottom match
            html += `<line x1="0" y1="${bottom}" x2="12" y2="${bottom}" stroke="#cbd5e1" stroke-width="2"/>`;
            // Vertical connecting
            html += `<line x1="12" y1="${top}" x2="12" y2="${bottom}" stroke="#cbd5e1" stroke-width="2"/>`;
            // Horizontal to next
            html += `<line x1="12" y1="${mid}" x2="24" y2="${mid}" stroke="#cbd5e1" stroke-width="2"/>`;
          }
          html += `</svg></div>`;
        }
      });

      bracketDisplay.innerHTML = html;
    }

    function renderSlot(match, slotIdx, roundIdx, matchIdx) {
      const player = slotIdx === 0 ? match.p1 : match.p2;
      if (!player) {
        if (match.isBye) {
          return `<div class="match-slot bye">부전승</div>`;
        }
        return `<div class="match-slot empty">-</div>`;
      }

      let cls = 'match-slot';
      if (match.isBye && match.winner === player) cls += ' winner';
      else if (match.winner === player) cls += ' winner';
      else if (match.winner && match.winner !== player) cls += ' loser';

      const clickable = !match.isBye && match.p1 && match.p2;
      const onclick = clickable ? `onclick="selectWinner(${roundIdx},${matchIdx},${slotIdx})"` : '';

      return `<div class="${cls}" ${onclick} title="${escapeHtml(player.name)} (${escapeHtml(player.dept)})">
        ${escapeHtml(player.name)} <span class="text-xs text-gray-400">${escapeHtml(player.dept)}</span>
      </div>`;
    }

    function getRoundNames(total) {
      const names = [];
      for (let i = 0; i < total; i++) {
        const remaining = total - i;
        if (remaining === 1) names.push('결승');
        else if (remaining === 2) names.push('준결승');
        else if (remaining === 3) names.push('8강');
        else names.push(`${Math.pow(2, remaining)}강`);
      }
      return names;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function launchConfetti() {
      const container = document.getElementById('confettiContainer');
      container.innerHTML = '';
      const colors = ['#0ea5e9', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];
      const div = document.createElement('div');
      div.className = 'confetti';
      for (let i = 0; i < 80; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDelay = Math.random() * 1.5 + 's';
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        piece.style.width = (Math.random() * 8 + 6) + 'px';
        piece.style.height = (Math.random() * 8 + 6) + 'px';
        div.appendChild(piece);
      }
      container.appendChild(div);
      setTimeout(() => container.innerHTML = '', 4000);
    }

    // Initialize — load from Google Sheets
    loadParticipants();
  </script>
</body>
</html>
